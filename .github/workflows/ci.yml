name: CI

on:
  push:
    branches: [master, main, V2]
  pull_request:
    branches: [master, main]

# Энэ workflow нь monorepo-ийн backend + frontend хоёуланд lint/test/build
# хийнэ. Backend ажлууд `working-directory: backend` дотор гүйнэ. Хуучин
# `backend/.github/workflows/` зам нь GitHub Actions-аар triggered байгаагүй
# (Actions нь зөвхөн root `.github/workflows/`-г уншдаг) — энд зөөв.

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend

  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage threshold
        # Backend нь тест-эзэгнэсэн (test-owned) template гэдгийг баталгаажуулна.
        # Хэрэв threshold-оос доош унавал PR-ыг хаана; локалд `make test-cover`-р
        # хувийн coverage-аа харж болно.
        run: |
          PCT=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%",""); print $3}')
          echo "Total coverage: ${PCT}%"
          THRESHOLD=30
          # awk-ээр floating compare — bash float дэмждэггүй.
          if awk "BEGIN { exit !($PCT < $THRESHOLD) }"; then
            echo "::error::Coverage ${PCT}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.out

  swag-drift:
    name: OpenAPI Spec Drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Catches PRs that change a handler annotation or DTO struct but
    # forget to run `make swag`. Without this, docs/swagger.* silently
    # decays away from the actual API.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install swag CLI
        run: go install github.com/swaggo/swag/cmd/swag@latest
      - name: Regenerate spec
        env:
          GOFLAGS: "-mod=mod"
        run: swag init -g cmd/api/main.go --output docs --parseDependency --parseInternal
      - name: Fail on diff
        run: |
          if ! git diff --exit-code -- docs/; then
            echo "::error::backend/docs/ is out of sync with handler annotations. Run 'make swag' locally and commit the result."
            exit 1
          fi

  integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # ubuntu-latest comes with Docker pre-installed, so testcontainers-go
    # can spin up Postgres and Redis without any extra setup. Pinned go
    # version matches the unit-test job so build cache stays warm.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Run integration tests
        env:
          GOFLAGS: "-mod=mod"
        run: go test -tags=integration -race -timeout=10m ./...

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build binary
        run: go build -o bin/api ./cmd/api/main.go
      - name: Build Docker image
        run: docker build -f deploy/Dockerfile .

  frontend-lint-build:
    name: Frontend Lint + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Build Docker image
        # Энэ нь Dockerfile-аа CI дээр шалгаж байгаа — runtime image
        # бараг хоосон тул build амжилттай болох нь хэрэглэгч deploy
        # хийхэд гэнэт unbreakable байна гэсэн үг.
        run: docker build -f Dockerfile .
